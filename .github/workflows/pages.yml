name: Deploy Buddy test copy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: buddy-test-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static test copy
        run: |
          mkdir -p _site/assets
          cp index.html LICENSE .nojekyll _site/
          cp assets/buddy-screen-renderer.js _site/assets/
          if [ -f .well-known/eats-the-world ]; then
            token="$(cat .well-known/eats-the-world)"
            [[ "$token" =~ ^etw-[A-Za-z0-9_-]{43}$ ]] || { echo "Invalid Eats the World proof file" >&2; exit 1; }
            mkdir -p _site/.well-known
            printf '%s\n' "$token" > _site/.well-known/eats-the-world
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
